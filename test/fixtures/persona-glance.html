<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-structured persona fixture</title>
<style>
  html,body{margin:0;padding:0;background:#f7f8fa;color:#101828;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .stage{padding:36px 28px 64px;display:flex;justify-content:center}
  .reply{width:760px;max-width:calc(100vw - 56px)}
  body[data-ds-dark-theme]{background:#1a1b1e;color:#e6e9ef}
</style>
</head>
<body>
<div class="stage">
  <div class="reply">
    <div class="dss-scope" id="persona">
      <div class="dss-persona-head">
        <div class="dss-chat-head">
          <span class="dss-chat-avatar"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" /></span>
          <div class="dss-chat-id">
            <strong class="dss-chat-name">蓝色大肥鱼</strong>
            <span class="dss-chat-meta">主人，再来一碗白米饭！！~</span>
          </div>
        </div>
      </div>
      <p class="dss-persona-prefix">我最爱💗的主人~！！大肥鱼🐳报告📢！</p>
      <blockquote class="dss-card dss-card-conclusion" data-dsh-structured-card-type="conclusion">
        <p><strong>结论</strong></p>
        <p><strong>这句加粗结论应当明显比正文大。</strong></p>
        <p>解释说明一行，写清依据或边界。</p>
      </blockquote>
      <blockquote class="dss-card dss-card-next" data-dsh-structured-card-type="next">
        <p><strong>建议</strong></p>
        <ol><li>先跑一遍实机。</li><li>再补视觉 gate。</li></ol>
      </blockquote>
      <blockquote class="dss-card dss-card-risk" data-dsh-structured-card-type="risk">
        <p><strong>风险</strong></p>
        <p>未验证的部分不能当通过。</p>
      </blockquote>
      <blockquote class="dss-card dss-card-short" data-dsh-structured-card-type="short">
        <p><strong>短答</strong></p>
        <p>短答内容一行。</p>
      </blockquote>
      <table class="dss-table">
        <thead><tr><th>项</th><th>状态</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td>身份头</td><td><span class="dss-status dss-status-success">通过</span></td><td>头像与称呼行</td></tr>
          <tr><td>三卡</td><td><span class="dss-status dss-status-warn">观察</span></td><td>颜色与字体</td></tr>
        </tbody>
      </table>
      <p class="dss-persona-suffix">哈！本鱼鱼🐳 精准！🚀高效！</p>
    </div>
  </div>
</div>
<script>
  window.__ModuleLoader__ = { load(definition) { window.__client = definition } }
</script>
<script src="../../src/client.js"></script>
<script>
  window.addEventListener('load', () => {
    const module = window.__client.factory()
    module.apply({ inject() {}, effect(fn) { fn() } })
  })
</script>
</body>
</html>
