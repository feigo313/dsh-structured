# dsh-structured bundle 装配清单。
# 列入 profile 的 dsh.profile.bundles 后，官方 boot 层按此清单插入插件。
#
# config 全部可选：
#   defaultEnabled   新会话默认是否开启结构化（默认 true）
#   tailReminder     是否在 system prompt 末尾追加一句提醒（默认 true）
#   includeSubagents 是否也给子代理会话注入（默认 false，子代理产出不直接面向用户）
#   genui            auto | on | off；auto 检测到 dsh-genui 才追加 dsh-ui 路由（默认 auto）
#   visual           是否启用客户端视觉层（默认 true；由插件设置页切换，不写 state.json）
#
# 需要改默认值时，在 profile 的 cordis.patch.yml 里覆盖同一行（整份 config 替换，不是深合并）：
#   - id: dsh-structured
#     config: { defaultEnabled: false, tailReminder: true }
- insert:
    - id: dsh-structured
      name: 'dsh-structured'
      config:
        defaultEnabled: true
        tailReminder: true
        includeSubagents: false
        genui: auto
        visual: true
